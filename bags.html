<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Majesty</title>

    <!-- Style -->
    <link rel="stylesheet" href="styles/style.css">


</head>
<body>

    <nav>
        <div class="logo">
             <h4 class="logo-title">La Majesty</h4>

             <ul class="nav-link">
                 
                <li><a href="index.html" class="link">Ring</a></li>
                <li><a href="bags.html" class="link">Bags</a></li>
                 
                <li><a href="https://www.instagram.com/lamajesty__/" class="link" target="_blank">Contact</a></li>

             </ul>
        </div>
         
    </nav>

    <!-- Horizontal Line -->
    <hr class="lines">  

    <header>
        <div class="header-content">
            <h4 class="header-title">Welcome to <span class="birthstone-font"> La Majesty </span></h4>
            <p class="header-subtitle">Experience the Royal Treatment</p>
            
        </div>
    </header>

    <section class="product" id="productSection">

        <h2 class="section-title">Our Exclusive Bags</h2>

        <div class="product-grid">

            <div class="product-card">
                <img src="./images/goyard bag.webp" alt="Product 1" class="product-image">
                <h3 class="product-name">Goyard Saint Lous tote </h3>
                <p class="product-description">Women</p>
                <div class="product-details">
                    <span class="product-price">₱99.99</span>
                    <span class="product-stocks">10 stocks</span>
                </div>
            </div>

            <div class="product-card">
                <img src="./images/goyardmessengerbag.webp" alt="Product 1" class="product-image">
                <h3 class="product-name">Goyard Messenger Bag Men</h3>
                <p class="product-description">Men</p>
                <div class="product-details">
                    <span class="product-price">₱99.99</span>
                    <span class="product-stocks">4 stocks</span>
                </div>
            </div>

            <div class="product-card">
                <img src="./images/goyardbag1.webp" alt="Product 1" class="product-image">
                <h3 class="product-name">Goyard </h3>
                <p class="product-description">Women</p>
                <div class="product-details">
                    <span class="product-price">₱99.99</span>
                    <span class="product-stocks">5 stocks</span>
                </div>
            </div>
           

        </div>

    </section>


</body>
</html>
